<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Password Generator</title>
    <link ref="styles.css">
  </head>
  <body>
    <div id="password-selection-settings-div">
      <input type="radio" id="uppercase-only" class="uppercase-only" value="uppercase-only" name="uppercase-lowercase"/>
      <label for="uppercase-only">Uppercase Only<label><br>

      <input type="radio" id="lowercase-only" class="lowercase-only" value="lowercase-only" name="uppercase-lowercase"/>
      <label for="lowercase-only">Lowercase Only<label><br>

      <input type="checkbox" id="include-symbols" class="include-symbols"/>
      <label for="include-symbols">Include Symbols<label><br>
        
      <input type="checkbox" id="include-numbers" class="include-numbers"/>
      <label for="include-numbers">Include Numbers</label><br>
    </div>
  </body>
</html>
